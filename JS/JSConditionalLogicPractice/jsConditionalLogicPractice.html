<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css" class="stylesheet">
    <title>JS Conditional Logic Practice</title>
</head>
<body>
    <h2>Output can also be seen via Console Log in Dev Tools</h2>
    &nbsp;
    <div><b>Problem 1</b></div>
    &nbsp;
    <div><i>Determine if a number is positive, negative, or zero</i></div>
    &nbsp;
    <input type="number" id="problem1" placeholder="Please enter a number."></input>
    <button onclick="checkNumber()">Check Number</button>
    <div id="problem1Output"></div>
    &nbsp;
    &nbsp;
    <div><b>Problem 2</b></div>
    &nbsp;
    <div><i>Determine if a person is old enough to vote (18+)</i></div>
    &nbsp;
    <input type="number" id="problem2" placeholder="Please enter your age."></input>
    <button onclick="checkVotingAge()">Check Voting Age</button>
    <div id="problem2Output"></div>
    &nbsp;
    &nbsp;
    <div><b>Problem 3</b></div>
    &nbsp;
    <div><i>What grade did you get?</i></div>
    &nbsp;
    <input type="number" id="problem3" placeholder="Please enter your score."></input>
    <button onclick="checkGrade()">Check Grade</button>
    <div id="problem3Output"></div>
    &nbsp;
    &nbsp;
    <div><b>Problem 4</b></div>
    &nbsp;
    <div><i>Can you enter the club?</i></div>
    &nbsp;
    <input type="number" id="problem4" placeholder="Please enter your age."></input>
    <br>
    <label>
        <input type="checkbox" id="hasID">
        I have a valid ID
    </label>
    <button onclick="checkClubEntry()">Check Club Entry</button>
    <div id="problem4Output"></div>

    <script src="jsConditionalLogicPractice.js"></script>
</body>
</html>
